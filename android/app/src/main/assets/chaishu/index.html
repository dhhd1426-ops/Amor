<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>拆书</title>
<style>
@font-face{font-family:"DM Sans";src:url(/font/400.ttf);font-weight:400}
@font-face{font-family:"DM Sans";src:url(/font/500.ttf);font-weight:500}
@font-face{font-family:"DM Sans";src:url(/font/600.ttf);font-weight:600}
:root{--top:0px;--bottom:0px;
  --k:1;
  --standard:cubic-bezier(.2,0,0,1);
  --decel:cubic-bezier(.05,.7,.1,1);
  --accel:cubic-bezier(.3,0,.8,.15);
  --tap:calc(var(--k)*80ms);
  --quick:calc(var(--k)*180ms);
  --base:calc(var(--k)*320ms);
  --emph:calc(var(--k)*420ms);
}
[data-skin=dark]{
  --page:#141414; --rail:#101010; --card:#1E1E1E; --press:#262626; --pop:#232325;
  --ink:#ECECEC; --muted:#9A9A9A; --faint:#5c5c5c; --line:rgba(255,255,255,.09);
  --accent:#E9B48E; --on-accent:#2A211B; --scrim:rgba(0,0,0,.5);
  --av-l:26%; --av-s:22%; --avt-l:80%; --avt-s:45%;
}
[data-skin=light]{
  --page:#F4F3EE; --rail:#ECEBE5; --card:#FAF9F5; --press:#E8E7E1; --pop:#FFFFFF;
  --ink:#1B1B19; --muted:#77766F; --faint:#b9b8b0; --line:rgba(0,0,0,.08);
  --accent:#C4875C; --on-accent:#FFFFFF; --scrim:rgba(20,20,18,.28);
  --av-l:90%; --av-s:30%; --avt-l:34%; --avt-s:35%;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--page);font-family:"DM Sans",-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}

button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.4;pointer-events:none}

/* 页面 */
.pg{position:absolute;inset:0;display:flex;background:var(--page);transition:transform var(--emph) var(--decel),background-color var(--base)}
.pg::after{content:"";position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity var(--emph) var(--decel)}
#mod{overflow:hidden}
.pg.off{transform:translateX(100%);pointer-events:none;box-shadow:-20px 0 40px rgba(0,0,0,.2)}
.pg.under{transform:translateX(-22%);pointer-events:none}
.pg.under::after{opacity:.35}
.app.back .pg,.app.back .pg::after{transition-duration:calc(var(--k)*300ms);transition-timing-function:var(--accel)}
.btn2.danger{background:color-mix(in oklab,#d0574f 18%,var(--card));color:#e0786f}
.run.err{color:#e0786f;background:color-mix(in oklab,#d0574f 14%,transparent)}
/* 书名即切换按钮 */
.bt{display:flex;align-items:center;gap:6px;max-width:100%;text-align:left;margin-left:-6px;padding:2px 6px;border-radius:10px}
.bt:active{background:var(--card);transform:scale(.98)}
.bt .dn{flex:none;width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bt .bn{flex:none;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
/* 书架弹层 */
.bk{display:flex;align-items:center;gap:14px;width:100%;padding:10px 8px;border-radius:14px;text-align:left}
.bk:active{background:var(--card);transform:scale(.98)}
.bk .cv{flex:none;width:38px;height:52px;border-radius:3px 6px 6px 3px;display:flex;justify-content:center;padding-top:6px;color:rgba(255,255,255,.88);font-size:10px;writing-mode:vertical-rl;letter-spacing:.2em;box-shadow:inset 3px 0 0 rgba(0,0,0,.18)}
.bk .t{flex:1;min-width:0}
.bk b{display:block;font-size:15.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk span{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}
.bk .ck{flex:none;width:20px;height:20px;stroke:var(--accent);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.6);transition:opacity var(--quick),transform var(--base) var(--decel)}
.bk[aria-current=true] .ck{opacity:1;transform:none}
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.app{position:relative;width:100%;height:100%;background:var(--page);overflow:hidden;overflow:clip;display:flex;transition:background-color var(--base) var(--standard)}


.press{transition:transform var(--quick) var(--standard),background-color var(--quick) var(--standard),opacity var(--quick) var(--standard)}
.press:active{transform:scale(.97);transition-duration:var(--tap)}

/* ---------- 左侧角色栏 ---------- */
.rail{flex:none;width:58px;background:var(--rail);display:flex;flex-direction:column;padding-top:calc(64px + var(--top));z-index:1;
  transform:translateX(-100%);transition:transform var(--emph) var(--decel),background-color var(--base)}
.app.has-book .rail{transform:none}
.rail-in{position:relative;flex:1;overflow-y:auto;padding:4px 0 40px;display:flex;flex-direction:column;align-items:center;gap:6px}
.rail-in::-webkit-scrollbar{display:none}
.rail-ind{position:absolute;left:7px;top:0;width:44px;height:44px;border-radius:14px;background:color-mix(in oklab,var(--accent) 20%,transparent);
  transition:transform var(--base) var(--standard),opacity var(--quick);pointer-events:none;opacity:0}
.ri{position:relative;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;
  opacity:0;transform:translateX(-8px)}
.ri.in{opacity:1;transform:none;transition:opacity var(--base) var(--decel),transform var(--base) var(--decel)}
.ri.in:active{transform:scale(.92);transition-duration:var(--tap)}
.ri .sq{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:15px;font-weight:500;
  background:hsl(var(--h) var(--av-s) var(--av-l));color:hsl(var(--h) var(--avt-s) var(--avt-l));transition:opacity var(--base) var(--standard),background-color var(--base),color var(--base)}
.ri.pend .sq{opacity:.38}
.ri.world .sq{background:var(--card);color:var(--accent)}
.ri.world .sq svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6}
.rail-sep{width:22px;height:1px;background:var(--line);margin:4px 0;flex:none}

/* ---------- 主区 ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.bar{display:flex;align-items:center;gap:2px;height:56px;padding:0 6px 0 4px;flex:none;margin-top:var(--top)}
.ibtn{width:44px;height:44px;border-radius:22px;display:grid;place-items:center}
.ibtn:active{background:var(--press)}
.ibtn svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.chip-btn{height:34px;padding:0 14px;border-radius:17px;background:var(--ink);color:var(--page);font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip-btn:active{opacity:.8;transform:scale(.96)}
.chip-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:calc(48px + var(--bottom))}
.scroll::-webkit-scrollbar{display:none}

/* 空状态：导入框 */
.drop{margin:40px 16px 0;border:1.5px dashed var(--faint);border-radius:22px;padding:34px 18px 26px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.drop .di{width:52px;height:52px;border-radius:16px;background:var(--card);display:grid;place-items:center;margin-bottom:6px}
.drop .di svg{width:24px;height:24px;stroke:var(--accent);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.drop b{font-size:16px;font-weight:600}
.drop small{font-size:12.5px;color:var(--muted)}
.drop .acts{display:flex;gap:8px;margin-top:16px}
.btn2{height:40px;padding:0 18px;border-radius:20px;background:var(--card);font-size:14px;font-weight:500}
.btn2:active{background:var(--press);transform:scale(.96)}
.btn2.pri{background:var(--ink);color:var(--page)}
.btn2.pri:active{opacity:.82}

/* 书目栏 */
.bookline{padding:0 16px}
.bt{display:flex;align-items:center;gap:8px}
.bt h1{font-size:22px;font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:11px;color:var(--accent);padding:2px 7px;border-radius:8px;background:color-mix(in oklab,var(--accent) 14%,transparent);flex:none}
.bs{font-size:12.5px;color:var(--muted);margin-top:5px;font-variant-numeric:tabular-nums}
.run{position:relative;margin-top:14px;width:100%;height:42px;border-radius:14px;background:color-mix(in oklab,var(--accent) 14%,transparent);color:var(--accent);
  font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px;overflow:hidden}
.run:active{transform:scale(.98);background:color-mix(in oklab,var(--accent) 22%,transparent)}
.run svg.star{width:16px;height:16px;fill:currentColor}
.run .lbl{transition:opacity var(--quick) var(--standard),transform var(--quick) var(--standard)}
.run .bar2{position:absolute;left:0;top:0;bottom:0;width:100%;background:color-mix(in oklab,var(--accent) 16%,transparent);transform-origin:left;transform:scaleX(0);transition:transform var(--base) var(--standard)}
.run.busy{pointer-events:none}
.run.done{opacity:0;transform:translateY(-6px);transition:opacity var(--base) var(--standard),transform var(--base) var(--standard);pointer-events:none}
.run-wrap{display:grid;grid-template-rows:1fr;transition:grid-template-rows var(--base) var(--standard)}
.run-wrap.gone{grid-template-rows:0fr}
.run-wrap>div{overflow:hidden}

.tabs{position:sticky;top:0;z-index:3;background:var(--page);padding:14px 16px 12px;transition:background-color var(--base)}
.seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);height:38px;background:var(--card);border-radius:19px;padding:3px}
.seg .knob{position:absolute;top:3px;left:3px;width:calc((100% - 6px)/3);height:32px;border-radius:16px;background:var(--pop);box-shadow:0 1px 3px rgba(0,0,0,.15);transition:transform var(--base) var(--standard)}
.seg button{position:relative;z-index:1;font-size:13.5px;font-weight:500;color:var(--muted);transition:color var(--quick)}
.seg button[aria-selected=true]{color:var(--ink)}
.pane{padding:0 16px;transition:opacity var(--quick) var(--standard),transform var(--quick) var(--standard)}
.pane[hidden]{display:none}
.pane.out-l{opacity:0;transform:translateX(-12px)} .pane.out-r{opacity:0;transform:translateX(12px)}

/* ---------- 角色卡 ---------- */
.cardwrap{transition:opacity var(--quick) var(--standard),transform var(--quick) var(--standard)}
.cardwrap.out-u{opacity:0;transform:translateY(-10px)} .cardwrap.out-d{opacity:0;transform:translateY(10px)}
.hero{display:flex;align-items:center;gap:14px;padding:16px;border-radius:20px;
  background:linear-gradient(135deg,color-mix(in oklab,var(--accent) 13%,var(--card)),var(--card) 70%)}
.hero .sq{width:54px;height:54px;border-radius:15px;display:grid;place-items:center;font-size:24px;font-weight:500;flex:none;
  background:hsl(var(--h) var(--av-s) var(--av-l));color:hsl(var(--h) var(--avt-s) var(--avt-l))}
.hero h2{font-size:21px;font-weight:600;display:flex;align-items:center;gap:8px}
.hero h2 .add{width:24px;height:24px;border-radius:12px;display:grid;place-items:center;font-size:16px;font-weight:400;color:var(--muted);background:var(--press)}
.hero p{font-size:12.5px;color:var(--muted);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips span{font-size:12.5px;padding:4px 10px;border-radius:12px;background:var(--card);color:var(--muted)}
.chips small{font-size:10.5px;color:var(--faint);margin-left:4px}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{position:relative;text-align:left;background:var(--card);border-radius:18px;padding:14px 14px 14px;min-height:124px;display:flex;flex-direction:column}
.tile:active,.tile.held{background:var(--press)}
.tile:active{transform:scale(.97)}
.tile .ti{width:22px;height:22px;stroke:var(--accent);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tile b{display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:600;margin-top:10px}
.tile b svg{width:14px;height:14px;stroke:var(--faint);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tile p{font-size:12.5px;color:var(--muted);line-height:1.55;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;transition:opacity var(--base) var(--standard)}
.tile .sk{margin-top:10px;display:grid;gap:6px}
.tile .sk i{height:7px;border-radius:4px;background:var(--line)}
.tile .sk i:last-child{width:60%}
.tile.wait .sk i{animation:breathe calc(var(--k)*1.1s) var(--standard) infinite alternate}
@keyframes breathe{from{opacity:.4}to{opacity:1}}
.tile.fresh p{animation:rise var(--base) var(--decel) both}
@keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.sec{display:flex;align-items:baseline;justify-content:space-between;margin:24px 2px 10px}
.sec h3{font-size:14px;font-weight:600}
.sec span{font-size:12px;color:var(--muted)}
.rrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;border-radius:16px;background:var(--card);margin-bottom:8px}
.rrow:active,.rrow.held{background:var(--press)}
.rrow:active{transform:scale(.98)}
.rrow .rt{flex:1;min-width:0}
.rrow b{font-size:15px;font-weight:500}
.rrow b em{font-style:normal;font-size:12px;color:var(--muted);font-weight:400;margin-left:8px}
.rrow p{font-size:13px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{width:15px;height:15px;stroke:var(--faint);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.av{--h:20;flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:500;
  background:hsl(var(--h) var(--av-s) var(--av-l));color:hsl(var(--h) var(--avt-s) var(--avt-l))}
.gav{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--press)}
.gav svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.note{padding:40px 20px;text-align:center;color:var(--muted);font-size:14px;line-height:1.7}

/* 对待不同的人 */
.targets{display:flex;gap:6px;overflow-x:auto;margin:0 -16px;padding:0 16px 2px;scrollbar-width:none}
.targets::-webkit-scrollbar{display:none}
.tg{flex:none;display:flex;align-items:center;gap:6px;height:36px;padding:0 13px 0 4px;border-radius:18px;background:var(--card);font-size:13.5px;color:var(--muted);
  transition:background-color var(--quick) var(--standard),color var(--quick) var(--standard),transform var(--quick) var(--standard)}
.tg:active{transform:scale(.95);transition-duration:var(--tap)}
.tg .av,.tg .gav{width:28px;height:28px;font-size:12.5px}
.tg .gav svg{width:15px;height:15px}
.tg[aria-selected=true]{background:var(--ink);color:var(--page)}
.tpanel{margin-top:12px;transition:opacity var(--quick) var(--standard),transform var(--quick) var(--standard)}
.tpanel.out-l{opacity:0;transform:translateX(-12px)} .tpanel.out-r{opacity:0;transform:translateX(12px)}
.tone{background:var(--card);border-radius:16px;padding:13px 14px}
.tone .lead{font-size:15px;line-height:1.6}
.tone p{font-size:13.5px;color:var(--muted);line-height:1.7;margin-top:4px}
.why{font-size:15px;line-height:1.9;margin-top:8px}
.why q{quotes:"「" "」"} .why q::before,.why q::after{color:var(--accent)}
.say-how{display:flex;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13.5px;line-height:1.7;color:var(--muted)}
.say-how svg{flex:none;width:16px;height:16px;margin-top:3px;stroke:var(--accent);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tpanel .scene{margin-top:8px;margin-bottom:0}
.more{display:flex;align-items:center;justify-content:center;gap:4px;width:100%;height:42px;margin-top:8px;border-radius:14px;font-size:13.5px;color:var(--muted)}
.more:active{background:var(--card);transform:scale(.98)}

/* 世界 */
.wcell{background:var(--card);border-radius:16px;padding:13px 14px;margin-top:10px}
.wcell dt{font-size:12px;color:var(--muted)}
.wcell dd{font-size:14.5px;line-height:1.75;margin-top:4px}

/* 关系网 */
.graph{position:relative;background:var(--card);border-radius:20px;overflow:hidden}
.graph svg{display:block;width:100%;height:auto}
.gn{cursor:pointer;transition:transform var(--emph) var(--standard),opacity var(--base) var(--standard)}
.gn circle{transition:fill var(--base)}
.gn text{font-size:12px;fill:var(--ink);text-anchor:middle;font-family:inherit}
.gn .glyph{font-size:15px;font-weight:500;dominant-baseline:central}
.gn:active{opacity:.7}
.gn:focus{outline:none}
.gn:focus-visible circle{stroke:var(--accent);stroke-width:2}
.ge{transition:opacity var(--base) var(--standard)}
.ge line{stroke:var(--line);stroke-width:1.4}
.ge text{font-size:10.5px;fill:var(--muted);text-anchor:middle;paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round}

/* 原文 */
.ch{display:flex;gap:12px;width:100%;text-align:left;padding:13px 10px;border-radius:14px}
.ch:active,.ch.held{background:var(--card)}
.ch:active{transform:scale(.98)}
.ch .no{flex:none;width:26px;font-size:12.5px;color:var(--muted);padding-top:2px}
.ch .tt{flex:1;font-size:14.5px;font-weight:500;line-height:1.5}
.ch .tt span{display:block;color:var(--muted);font-weight:400}
.ch .wc{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}

/* ---------- 底部弹层 ---------- */
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;pointer-events:none;z-index:10;transition:opacity var(--emph) var(--decel)}
.scrim.on{opacity:1;pointer-events:auto}
.scrim.closing{transition-duration:calc(var(--k)*280ms);transition-timing-function:var(--accel)}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:11;background:var(--pop);border-radius:24px 24px 0 0;height:84%;
  transform:translateY(100%);transition:transform var(--emph) var(--decel),background-color var(--base);display:flex;flex-direction:column;visibility:hidden;
  padding-bottom:var(--bottom)}
.sheet.on{transform:none;visibility:visible}
.sheet.closing{transition:transform calc(var(--k)*280ms) var(--accel),visibility 0s calc(var(--k)*280ms);visibility:hidden}
.sheet.drag{transition:none}
.grab{flex:none;height:26px;display:grid;place-items:center;cursor:grab;touch-action:none}
.grab i{width:36px;height:4px;border-radius:2px;background:var(--faint)}
.shead{flex:none;display:flex;align-items:center;gap:4px;padding:0 8px 0 10px;height:46px}
.shead h2{flex:1;font-size:18px;font-weight:600;padding-left:4px;transition:opacity var(--quick) var(--standard)}
.sback{width:0;overflow:hidden;opacity:0;transition:width var(--quick) var(--standard),opacity var(--quick) var(--standard)}
.sback.on{width:44px;opacity:1}
.sbody{position:relative;flex:1;overflow:hidden}
.view{position:absolute;inset:0;overflow-y:auto;padding:6px 20px 40px;transition:opacity var(--base) var(--standard),transform var(--base) var(--standard)}
.view::-webkit-scrollbar{display:none}
.view.from-r{opacity:0;transform:translateX(18px)} .view.from-l{opacity:0;transform:translateX(-18px)}
.view.leave-l,.view.leave-r{opacity:0;transition-duration:var(--quick);transition-timing-function:var(--accel);pointer-events:none}
.view.leave-l{transform:translateX(-18px)} .view.leave-r{transform:translateX(18px)}
.view h3{font-size:12.5px;font-weight:500;color:var(--muted);margin:24px 0 10px}
.view h3:first-child{margin-top:8px}

.facts{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-radius:16px;overflow:hidden}
.fact{text-align:left;padding:12px 12px;display:flex;flex-direction:column;min-height:88px;position:relative}
.fact+.fact::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:1px;background:var(--line)}
.fact:active{background:var(--press)}
.fact .fk{font-size:12px;color:var(--muted)}
.fact .fv{font-size:15px;font-weight:600;margin-top:5px;line-height:1.35}
.fact .fv.none{color:var(--faint);font-weight:400}
.fact small{margin-top:auto;padding-top:6px;font-size:11px;color:var(--muted)}
.fact small i{font-style:normal;color:var(--accent)}
.lead{font-size:16.5px;font-weight:600;line-height:1.6}

/* ================= 书架：存在本机 ================= */
// App 里经 window.CS 存成文件（filesDir/chaishu/<id>.json）；网页预览时退回 localStorage
const NATIVE=typeof window.CS!=='undefined';
const books=[];
const LS='chaishu.v2';
function strip(b){const o={...b};for(const k of Object.keys(o))if(k.startsWith('_'))delete o[k];return o}
function persist(b){
  if(!b||!b.id)return;
  const json=JSON.stringify(strip(b));
  if(NATIVE){try{CS.save(b.id,json)}catch(e){}}
  else{try{const all=JSON.parse(localStorage.getItem(LS)||'{}');all[b.id]=JSON.parse(json);localStorage.setItem(LS,JSON.stringify(all))}catch(e){}}
}
function remember(){try{localStorage.setItem(LS+'.cur',B?.id||'')}catch(e){}}
function normBook(b){
  b.chapters=(b.chapters||[]).map(c=>({...c,t:Array.isArray(c.t)?c.t:[String(c.t||''),'']}));
  b.order=b.order||[];b.unit=b.unit||'章';
  if(b.chars)for(const k in b.chars){const c=b.chars[k];c.ch=c.ch||[];c.al=c.al||[];c.ti=c.ti||[];c.rel=c.rel||[];c.tl=c.tl||{};c.n=c.n||k}
  return b;
}
function restore(){
  let list=[];
  if(NATIVE){try{list=JSON.parse(CS.list())}catch(e){}}
  else{try{list=Object.values(JSON.parse(localStorage.getItem(LS)||'{}'))}catch(e){}}
  list.forEach(x=>{try{books.push(normBook(x))}catch(e){}});
  let cur=null;try{cur=localStorage.getItem(LS+'.cur')}catch(e){}
  const b=books.find(x=>x.id===cur)||books[0];
  if(b)openBook(b,true);
}
function addBook(b){books.unshift(b);persist(b);}
function dropBook(b){
  const i=books.indexOf(b);if(i>=0)books.splice(i,1);
  b._stop=true;
  if(NATIVE){try{CS.remove(b.id)}catch(e){}}
  else{try{const all=JSON.parse(localStorage.getItem(LS)||'{}');delete all[b.id];localStorage.setItem(LS,JSON.stringify(all))}catch(e){}}
  if(b===B){if(books[0])openBook(books[0]);else showEmpty();}
}
function showEmpty(){
  B=null;sel=null;remember();
  app.classList.remove('has-book');
  $('#rail').querySelectorAll('.ri,.rail-sep').forEach(x=>x.remove());$('#railInd').style.opacity=0;
  $('#bookArea').hidden=true;$('#empty').hidden=false;
}
const coverBg=b=>{let h=b.sample?8:0;if(!b.sample)for(const ch of b.title)h=(h*31+ch.charCodeAt(0))%360;return `background:linear-gradient(160deg,hsl(${h} 38% 38%),hsl(${h} 42% 24%))`};
const bookSub=b=>{
  const p=b.sample?{done:b.analyzed,total:b.chapters.length}:(b.prog||{done:0,total:0});
  const st=(b.sample?b.analyzed>=b.chapters.length:b.done)?'已分析':p.done?`分析到 ${p.done}/${p.total}`:'未分析';
  return [b.chapters.length+' '+(b.unit||'章'),b.order?.length?b.order.length+' 人':null,st].filter(Boolean).join(' · ');
};

/* 「⋯」：重新分析、删除这本（删除点两次） */
let delArm=0;
function moreHTML(){
  delArm=0;
  return `<div style="display:flex;flex-direction:column;gap:8px;padding:2px 0 18px">
    <button class="btn2" data-act="show-import">导入小说</button>
    ${B.sample?'':`<button class="btn2" data-act="redo">重新分析</button>`}
    <button class="btn2" data-act="del" id="delBtn">删除这本书</button></div>`;
}
function moreAct(t){
  const a=t.dataset.act;
  if(a==='show-import'){go({k:'import'});return true;}
  if(a==='select-person'){const id=t.dataset.person;hideSheet();select(id);return true;}
  if(a==='analysis-model'){
    B._modelChoice=t.dataset.provider?{provider:t.dataset.provider,name:t.dataset.model}:null;
    hideSheet();renderAnalysisModel(B);return true;
  }
  if(a==='redo'){hideSheet();resetAnalysis(B);return true;}
  if(a==='del'){
    if(Date.now()-delArm>3000){delArm=Date.now();t.textContent='再点一次删除';t.classList.add('danger');
      setTimeout(()=>{if(Date.now()-delArm>=3000&&document.contains(t)){t.textContent='删除这本书';t.classList.remove('danger')}},3000*K);return true;}
    const b=B;hideSheet(true);dropBook(b);toast(`删掉了《${b.title}》`);return true;
  }
  return false;
}

function loadDemo(){

  const b=makeDemo();addBook(b);openBook(b);

function makeDemo(){
  const b=structuredClone(HLM);
  b.id='sample';b.unit='回';
  b.analyzed=0;b.wc=b.chapters.reduce((s,c)=>s+c.wc,0);b.sample=true;
  for(const id in b.chars)b.chars[id].ch=[];
  b.chapters.forEach((c,i)=>c.cast.forEach(id=>b.chars[id].ch.push(i+1)));
  b.order=Object.keys(b.chars).sort((x,y)=>b.chars[y].ch.length-b.chars[x].ch.length||b.chars[x].ch[0]-b.chars[y].ch[0]);
  return b;
}
/* 读进来的文字 → 一本新书（还没分析） */
function fromText(name,text,id){
  text=String(text||'').replace(/\r\n?/g,'\n');
  const {chapters,unit}=splitChapters(text);
  const b={id:id||('b'+Date.now().toString(36)),title:name||'未命名',unit,chapters,wc:chapters.reduce((s,c)=>s+c.wc,0),chars:{},order:[],done:false,prog:{done:0,total:0}};
  b._text=text;
  addBook(b);openBook(b);
  toast(`切出 ${chapters.length} ${unit}`);
}
$('#file').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  hideSheet(true);
  let text='';try{text=f.name.toLowerCase().endsWith('.epub')?await epubText(f):decode(await f.arrayBuffer())}catch(err){}
  if(!text.trim())return toast('这个文件里读不出文字');
  fromText(f.name.replace(/\.[^.]+$/,''),text);
};

function openBook(b,instant){
  hideSheet(true);
  if(B&&B!==b&&!instant&&!RM.matches){
    const sc=$('#scroll');sc.style.transition=`opacity ${T(140)}ms var(--accel),transform ${T(140)}ms var(--accel)`;sc.style.opacity=0;sc.style.transform='translateY(6px)';
    $('#rail').style.transition=`opacity ${T(140)}ms`;$('#rail').style.opacity=0;
    setTimeout(()=>{openBook(b,true);sc.style.transform='translateY(-6px)';void sc.offsetWidth;
      sc.style.transition=`opacity ${T(260)}ms var(--decel),transform ${T(320)}ms var(--decel)`;sc.style.opacity=1;sc.style.transform='';$('#rail').style.opacity=1;},T(150));
    return;
  }
  B=b;sel=null;remember();
  $('#bCount').textContent=books.length>1?books.length:'';
  $('#empty').hidden=true;$('#bookArea').hidden=false;
  app.classList.add('has-book');
  $('#bTitle').textContent=b.title;$('#bBadge').hidden=!b.sample;
  stats();
  const rw=$('#runWrap'),rb=$('#runBtn');
  runState();
  // 角色栏
  const rail=$('#rail');rail.querySelectorAll('.ri,.rail-sep').forEach(x=>x.remove());$('#railInd').style.opacity=0;
  const items=[];
  if(b.world)items.push(railItem('world'));
  if(b.world&&b.order.length){const s=document.createElement('div');s.className='rail-sep';rail.appendChild(s);}
  b.order.forEach(id=>items.push(railItem(id)));
  items.forEach((el,i)=>enter(el,80+Math.min(i,14)*30));
  // 原文
  const box=$('#chs');box.innerHTML='';
  b.chapters.forEach((c,i)=>{const r=document.createElement('button');r.className='ch press';
    r.innerHTML=`<div class="no">${cnNum(i+1)}</div><div class="tt">${esc(c.t[0])}${c.t[1]?`<span>${esc(c.t[1])}</span>`:''}</div><div class="wc">${(c.wc/1000).toFixed(1)}k</div>`;
    r.onclick=()=>openSheet({k:'ch',i},r);box.appendChild(r);});
  setTab(0,true);
  select(b.order[0]||null,true);
  $('#scroll').scrollTop=0;
}

}

/* ================= 模型分析 =================
 * 三步，每一步做完就存（停了能续跑）：
 *   一、逐段抽取：按章节切成 9000 字左右一段，3 段并发；每段要章节梗概、出场人物、人物材料、对待别人的方式与原话、世界线索。
 *       模型给的 JSON 不完整就把这一段对半拆开重来（最多拆两层）。
 *   二、成卡：出场两章以上的人（最多 30 个）各写一张卡，3 个并发。材料按人归并，别名合到本名下。
 *   三、世界：用各章梗概和世界线索写世界背景。
 * 原句逐字核对：卡片里的原句、对白在原文里找不到就去掉，<q> 引文找不到就改成普通字。
 */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let reqN=0;const pending=new Map();
function ask(b,system,user,max){
  return new Promise((res,rej)=>{
    if(!NATIVE)return rej(Object.assign(new Error('网页预览里不能调模型，请在 App 里分析'),{fatal:true}));
    const id='r'+(++reqN);pending.set(id,{res,rej});
    try{CS.ask(b._modelSession,id,system,user,max)}catch(e){pending.delete(id);rej(e)}
  });
}
function onReply(id,ok,text,fatal){const p=pending.get(id);if(!p)return;pending.delete(id);ok?p.res(text):p.rej(Object.assign(new Error(text),{fatal:!!fatal}))}
function parseJSON(t){
  t=String(t||'').replace(/^\s*```(?:json)?/i,'').replace(/```\s*$/,'');
  const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a<0||b<=a)return null;
  const s=t.slice(a,b+1);
  try{return JSON.parse(s)}catch(e){try{return JSON.parse(s.replace(/,\s*([}\]])/g,'$1'))}catch(e2){return null}}
}
async function askJSON(b,system,user,max,valid){
  let last;
  for(let k=0;k<3;k++){
    if(b._stop)throw Object.assign(new Error('stop'),{stop:true});
    try{
      const o=parseJSON(await ask(b,system,user,max));
      if(b._stop)throw Object.assign(new Error('stop'),{stop:true});
      if(o&&valid(o))return o;
      last=new Error('模型返回的分析资料不完整');
    }
    catch(e){if(e.fatal||e.stop)throw e;last=e;}
    if(k<2)await sleep(1500*(k+1));
  }
  throw last;
}

/* ---------- 原文 ---------- */
async function textOf(b){
  if(b._text)return b._text;
  if(NATIVE){const r=await fetch('/text/'+b.id);if(r.ok){b._text=await r.text();return b._text}}
  throw Object.assign(new Error('这本书的原文不在了，请重新导入'),{fatal:true});
}
const norm=s=>String(s||'').replace(/[\s　]+/g,'');
/** 把原文压成去空白的一长串，记下每章在里面的起点，用来核对原句、找原句在第几章。 */
function index(b,text){
  if(b._flat)return;
  const lines=text.split('\n');b._lines=lines;
  const starts=b.chapters.map(c=>c.line||0);
  let flat='',pos=[],ci=0;
  for(let i=0;i<lines.length;i++){
    while(ci<starts.length&&starts[ci]<=i){pos[ci]=flat.length;ci++}
    flat+=norm(lines[i]);
  }
  while(ci<starts.length){pos[ci]=flat.length;ci++}
  b._flat=flat;b._pos=pos;
}
function locate(b,q){
  const n=norm(q);if(n.length<4)return 0;
  const at=b._flat.indexOf(n);if(at<0)return 0;
  let c=0;for(let i=0;i<b._pos.length;i++)if(b._pos[i]<=at)c=i+1;
  return c||1;
}

/* ---------- 切段 ---------- */
function chunks(b,text){
  const lines=b._lines||text.split('\n');
  const out=[];let cur=null;
  const flush=()=>{if(cur&&cur.text.trim())out.push(cur);cur=null};
  b.chapters.forEach((c,i)=>{
    const from=c.line||0,to=i+1<b.chapters.length?(b.chapters[i+1].line||lines.length):lines.length;
    const body=lines.slice(from+(c.head?1:0),to).join('\n');
    const head=`【第${i+1}${b.unit} ${c.t[0]}${c.t[1]?' '+c.t[1]:''}】\n`;
    if(body.length>14000){ // 一章太长：按行再切
      flush();
      const ls=body.split('\n');let part='';
      for(const l of ls){part+=l+'\n';if(part.length>9000){out.push({a:i+1,b:i+1,text:head+part});part=''}}
      if(part.trim())out.push({a:i+1,b:i+1,text:head+part});
      return;
    }
    if(!cur)cur={a:i+1,b:i+1,text:''};
    cur.text+=head+body+'\n';cur.b=i+1;
    if(cur.text.length>=9000)flush();
  });
  flush();
  return out;
}

没有依据的项省略，原句必须逐字取自线索。

/* ---------- 归并材料 ---------- */
function rawOf(b){
  if(!b.raw)b.raw={people:{},alias:{},world:[]};
  return b.raw;
}
const uniq=a=>[...new Set(a.filter(Boolean).map(x=>typeof x==='string'?x.trim():x))];
function keyOf(raw,name){name=String(name||'').trim();return raw.alias[name]||name}
function absorb(b,ck,o){
  const raw=rawOf(b),tag=`[${ck.a}${ck.a===ck.b?'':'-'+ck.b}]`;
  (o.chapters||[]).forEach(c=>{const i=(+c.n||0)-1;if(i<0||i>=b.chapters.length)return;
    const ch=b.chapters[i];ch.sum=c.sum||ch.sum;ch.ev=(c.ev||ch.ev||[]).slice(0,5);ch.cast=uniq([...(ch.cast||[]),...(c.cast||[])]);});
  (o.people||[]).forEach(p=>{
    if(!p||!p.name)return;
    let k=keyOf(raw,p.name);
    for(const a of p.aliases||[])if(raw.people[keyOf(raw,a)]&&!raw.people[k]){k=keyOf(raw,a);break}
    const r=raw.people[k]||(raw.people[k]={name:k,aliases:[],titles:[],gender:[],age:[],height:[],bg:[],look:[],pers:[],events:[],toward:{},ch:[]});
    for(const a of [p.name,...(p.aliases||[])]){const t=String(a||'').trim();if(t&&t!==k){raw.alias[t]=k;if(!r.aliases.includes(t))r.aliases.push(t)}}
    for(const t of p.titles||[])if(Array.isArray(t)&&t[0]&&!r.titles.some(x=>x[0]===t[0]))r.titles.push([String(t[0]),String(t[1]||'')]);
    for(const f of ['gender','age','height'])if(Array.isArray(p[f])&&p[f][0])r[f].push([...p[f].slice(0,3),ck.a]);
    for(const f of ['bg','look','pers'])for(const x of p[f]||[])r[f].push(tag+' '+x);
    for(const e of p.events||[])if(e&&e.t){r.events.push({n:+e.n||ck.a,t:e.t});r.ch.push(+e.n||ck.a)}
    for(const t of p.toward||[]){
      if(!t||!t.to)continue;
      const tk=t.group?String(t.to).trim():keyOf(raw,t.to);
      const w=r.toward[tk]||(r.toward[tk]={to:tk,group:!!t.group,type:t.type||'',how:[],why:[],lines:[]});
      if(t.type&&!w.type)w.type=t.type;
      if(t.how)w.how.push(tag+' '+t.how);if(t.why)w.why.push(tag+' '+t.why);
      for(const l of t.lines||[])if(l&&l.q)w.lines.push({ctx:l.ctx||'',q:l.q,who:l.who||'',n:ck.a});
    }
  });
  for(const w of o.world||[])raw.world.push(tag+' '+w);
}
/** 每个人出场的章：章节出场名单 + 他做事的章。 */
function castMap(b){
  const raw=rawOf(b),m={};
  b.chapters.forEach((c,i)=>(c.cast||[]).forEach(n=>{const k=keyOf(raw,n);(m[k]=m[k]||new Set()).add(i+1)}));
  for(const k in raw.people)for(const n of raw.people[k].ch)(m[k]=m[k]||new Set()).add(n);
  return m;
}
const cap=(a,n)=>a.length>n?a.slice(0,n):a;
function material(b,k){
  const r=rawOf(b).people[k];
  const tw=Object.values(r.toward).sort((x,y)=>(y.how.length+y.lines.length)-(x.how.length+x.lines.length)).slice(0,12)
    .map(w=>({to:w.to,group:w.group,type:w.type,how:cap(w.how,6),why:cap(w.why,6),lines:cap(w.lines,6)}));
  const m={name:r.name,aliases:r.aliases,titles:cap(r.titles,10),gender:cap(r.gender,4),age:cap(r.age,4),height:cap(r.height,4),
    bg:cap(r.bg,12),look:cap(r.look,12),pers:cap(r.pers,16),events:cap(r.events,40),toward:tw};
  while(JSON.stringify(m).length>18000&&(m.events.length>10||m.toward.length>4)){m.events=m.events.slice(0,Math.max(10,m.events.length-10));m.toward=m.toward.slice(0,Math.max(4,m.toward.length-2))}
  return m;
}

/* ---------- 定稿 ---------- */
const hue=s=>{let h=0;for(const ch of s)h=(h*31+ch.charCodeAt(0))%360;return h};
const glyph=n=>{const a=[...n];return a.length===3?a[1]:a.length===2?a[1]:a[0]};
function skeleton(b){
  const raw=rawOf(b),cm=castMap(b),chars={};
  for(const k in raw.people){
    const r=raw.people[k],ch=[...(cm[k]||[])].sort((x,y)=>x-y);
    if(!ch.length&&!r.events.length&&!Object.keys(r.toward).length)continue;
    const old=b.chars?.[k];
    chars[k]=Object.assign({n:k,a:glyph(k),h:hue(k),r:'',al:cap(r.aliases,6),ti:cap(r.titles,8),ch,
      tl:Object.fromEntries(r.events.map(e=>[e.n,e.t])),
      rel:Object.values(r.toward).filter(w=>!w.group).map(w=>[w.to,w.type||''])},old&&old.fx?{r:old.r,fx:old.fx,bg:old.bg,build:old.build,pers:old.pers,rels:old.rels,tl:old.tl}:{});
  }
  b.chars=chars;
  b.chapters.forEach(c=>{c.cast=uniq((c.cast||[]).map(n=>keyOf(raw,n))).filter(n=>chars[n])});
  b.order=Object.keys(chars).sort((x,y)=>chars[y].ch.length-chars[x].ch.length||(chars[x].ch[0]||0)-(chars[y].ch[0]||0));
}
/** 卡片里的原句逐字核对；章号以原文里真找到的位置为准。 */
function qclean(b,s){return String(s||'').replace(/<q>([\s\S]*?)<\/q>/g,(m,q)=>locate(b,q)?`<q>${q}</q>`:q)}
function fixCard(b,k,o){
  const raw=rawOf(b),c=b.chars[k],first=c.ch[0]||1;
  const fx={};for(const f of ['gender','age','height']){const v=o.fx?.[f];if(Array.isArray(v)&&v[0])fx[f]=[String(v[0]),v[1]==='推断'?'推断':'明示',+v[2]||first]}
  const sec=x=>x&&x.v?{v:String(x.v),d:qclean(b,x.d),s:(x.s||[]).map(([n,q])=>{const at=locate(b,q);return at?[at,q]:null}).filter(Boolean).slice(0,4)}:null;
  const rels=(o.rels||[]).slice(0,8).map(r=>{
    let to=r.to?keyOf(raw,r.to):'',g=r.g||'';
    if(to&&!b.chars[to]){g=g||r.to;to=''}
    if(!to&&!g)return null;
    return {to:to||undefined,g:to?undefined:g,type:r.type||'',v:r.v||'',why:qclean(b,r.why),tone:r.tone||'',
      att:(r.att||[]).filter(a=>a&&a.v).map(a=>({v:a.v,d:qclean(b,a.d),c:+a.c||first})),
      sc:(r.sc||[]).map(x=>{const at=x&&locate(b,x.q);return at?{ctx:x.ctx||'',q:x.q,who:x.who||c.n,c:at}:null}).filter(Boolean).slice(0,3)};
  }).filter(Boolean);
  Object.assign(c,{r:o.r||c.r||'',fx,bg:sec(o.bg)||{v:'',d:'',s:[]},build:sec(o.build)||{v:'',d:'',s:[]},pers:sec(o.pers)||{v:'',d:'',s:[]},rels});
  if(o.tl&&typeof o.tl==='object')for(const n in o.tl)if(+n)c.tl[+n]=o.tl[n];
}

/* ---------- 调度 ---------- */
function setProg(b){
  if(B!==b)return;
  const p=b.prog;
  $('#runLbl').textContent=b._busy?`分析中 ${p.done}/${p.total}`:p.done?`继续分析 ${p.done}/${p.total}`:'分析本书';
  $('#runBar').style.transform=`scaleX(${p.total?p.done/p.total:0})`;
}
async function pool(items,n,fn,b){
  let i=0,failure=null;
  const worker=async()=>{
    while(i<items.length&&!b._stop&&!failure){
      try{await fn(items[i++])}catch(error){failure=failure||error}
    }
  };
  await Promise.all(Array.from({length:Math.min(n,items.length)},worker));
  if(failure)throw failure;
}
function picksForCards(b){
  const short=b.chapters.length<=3;
  return b.order.filter(k=>short||b.chars[k].ch.length>=2).slice(0,short?12:30);
}
async function analyze(b){
  const text=await textOf(b);index(b,text);
  const raw=rawOf(b);
  const cks=chunks(b,text);
  raw.done=raw.done||{};
  // 预估总量：段数 + 卡片数（成卡前按 30 估）+ 世界 1
  const est=()=>cks.length+(raw.cards?raw.cards.length:Math.min(30,Object.keys(raw.people).length||30))+1;
  b.prog={done:Object.keys(raw.done).length+(raw.cardsDone?raw.cardsDone.length:0)+(b.world?1:0),total:est()};setProg(b);
  // 一、逐段抽取
  const todo=cks.map((ck,i)=>({...ck,key:ck.a+'-'+ck.b+'-'+i})).filter(ck=>!raw.done[ck.key]);
  const extract=async(ck,depth=0)=>{
    try{
      const out=await askJSON(b,SYS,p1(b,ck),6000,o=>Array.isArray(o.chapters)&&o.chapters.some(c=>c?.sum?.trim())&&Array.isArray(o.people));
      return [[ck,out]];
    }catch(e){
      if(e.fatal||e.stop||depth>=2||ck.text.length<=3000)throw e;
      const mid=ck.text.length>>1,line=ck.text.indexOf('\n',mid);
      const at=line>mid&&line<ck.text.length-1?line:mid;
      return [...await extract({...ck,text:ck.text.slice(0,at)},depth+1),...await extract({...ck,text:ck.text.slice(at)},depth+1)];
    }
  };
  await pool(todo,3,async ck=>{
    const parts=await extract(ck);
    for(const [part,out] of parts)absorb(b,part,out);
    raw.done[ck.key]=1;b.prog.done++;b.prog.total=est();setProg(b);persist(b);
  },b);
  if(b._stop)return;
  // 二、成卡
  skeleton(b);persist(b);
  if(B===b){openBook(b,true);}
  raw.cards=raw.cards||picksForCards(b);raw.cardsDone=raw.cardsDone||[];
  b.prog.total=est();setProg(b);
  const left=raw.cards.filter(k=>!raw.cardsDone.includes(k)&&raw.people[k]);
  await pool(left,3,async k=>{
    fixCard(b,k,await askJSON(b,SYS,p2(b,k,material(b,k)),7000,o=>typeof o.r==='string'&&!!o.r.trim()));
    raw.cardsDone.push(k);b.prog.done++;setProg(b);persist(b);lightUp(b,k);
  },b);
  if(b._stop)return;
  // 三、世界
  if(!b.world){
    const notes={chapters:b.chapters.slice(0,60).map((c,i)=>({n:i+1,sum:c.sum||''})),world:cap(raw.world,40)};
    const o=await askJSON(b,SYS,p3(b,notes),3000,o=>typeof o.sum==='string'&&Array.isArray(o.items));
    b.world={sum:o.sum,items:o.items.filter(x=>Array.isArray(x)&&x[0]&&x[1]).map(([k,t,src])=>{
      const q=Array.isArray(src)?src[1]:'';const at=q?locate(b,q):0;return [k,t,at?[at,q]:[0,'']]})};
    if(!b.world.sum&&!b.world.items.length)b.world=null;
    b.prog.done++;
  }
  b.done=true;delete b.raw;b.prog={done:b.prog.total,total:b.prog.total};
  persist(b);
}
function lightUp(b,k){
  if(B!==b)return;
  const el=$('#rail').querySelector(`.ri[data-id="${CSS.escape(k)}"]`);
  if(el)el.classList.toggle('pend',!ready(k));
  if(sel===k){renderCard();$('#cardwrap').querySelectorAll('.tile').forEach(t=>t.classList.add('fresh'))}
}
function resetAnalysis(b){
  if(b.sample)return;
  if(b._busy){toast('请先停止当前分析');return;}
  b.chars={};b.order=[];b.world=null;b.done=false;delete b.raw;b.prog={done:0,total:0};
  b.chapters.forEach(c=>{delete c.sum;delete c.ev;c.cast=[]});
  b._stop=false;persist(b);if(B===b)openBook(b,true);
}
function runState(){
  const b=B,rw=$('#runWrap'),rb=$('#runBtn');
  const done=b.sample?b.analyzed>=b.chapters.length:!!b.done;
  rw.classList.toggle('gone',done);rb.className='run';rb.disabled=false;renderAnalysisModel(b);
  if(b.sample){$('#runLbl').textContent=b.analyzed?`继续分析 ${b.analyzed}/${b.chapters.length}`:'播放分析示例';$('#runBar').style.transform=`scaleX(${b.analyzed/b.chapters.length})`;}
  else{b.prog=b.prog||{done:0,total:0};setProg(b);}
}
async function finishRun(b){
  if(B!==b)return;
  stats();
  $('#runLbl').textContent='完成';
  await wait(500);
  if(B!==b)return;
  $('#runBtn').classList.add('done');

}
function analysisModels(){
  if(!NATIVE)return {active:null,options:[]};
  try{return JSON.parse(CS.models())}catch(e){return {active:null,options:[]}}
}
function renderAnalysisModel(b){
  const button=$('#runModel');
  button.hidden=b.sample||!NATIVE;
  button.disabled=!!b._busy||!!b.done;
  if(button.hidden)return;

}
function modelChoices(){
  const models=analysisModels(), selected=B._modelChoice;
  return [{provider:'',name:'',label:'跟随当前助理',detail:models.active?.name||'未配置'},...models.options.map(m=>({...m,detail:m.label,label:m.name}))]
    .map(m=>`<button type="button" class="choice press" data-act="analysis-model" data-provider="${esc(m.provider)}" data-model="${esc(m.name)}" aria-pressed="${(selected?.provider||'')===m.provider&&(selected?.name||'')===m.name}">${esc(m.label)}<small>${esc(m.detail)}</small></button>`).join('');
}
$('#runModel').onclick=()=>{if(!B._busy&&!B.sample)openSheet({k:'models'},$('#runModel'));};
$('#runBtn').onclick=async()=>{
  const b=B,btn=$('#runBtn');
  if(b._busy){b._stop=true;btn.classList.remove('err');$('#runLbl').textContent='正在停止…';return;}
  if(b.done)return;
  if(b.sample)return runSample(b);
  if(!NATIVE){toast('请在 Amor App 中运行模型分析');return;}
  let session;
  try{
    session=JSON.parse(CS.begin(b._modelChoice?.provider||'',b._modelChoice?.name||''));
    if(!session.session)throw new Error(session.error||'无法启动分析');
  }catch(e){toast(String(e.message||e).slice(0,100));return;}
  b._modelSession=session.session;b._runModel=session;b._busy=true;b._stop=false;
  btn.classList.remove('err');renderAnalysisModel(b);setProg(b);
  try{
    await analyze(b);
    b._busy=false;
    if(b.done){delete b._modelChoice;finishRun(b)}else setProg(b);
  }catch(e){
    b._busy=false;b._stop=true;persist(b);
    if(B===b){setProg(b);if(!e.stop){btn.classList.add('err');$('#runLbl').textContent='没分析完 · 点这里接着来';}}
    if(!e.stop)toast(String(e.message||e).slice(0,100));
  }finally{
    CS.end(session.session);delete b._modelSession;delete b._runModel;
    if(B===b)renderAnalysisModel(b);
  }
};
/* 示例书：资料是写好的，按章亮起来演示一遍 */
async function runSample(b){
  const btn=$('#runBtn');if(b._busy)return;b._busy=true;
  const n=b.chapters.length;
  for(let i=b.analyzed;i<n;i++){
    $('#runLbl').textContent=`分析中 ${i}/${n}`;

/* ================= 关系网：选中的人在中间，点别人换中心 ================= */
const G={W:334,H:380,nodes:new Map()};
function graphData(){
  if(!B.chars||!B.order.length)return null;
  const id=(!sel||sel==='world')?B.order[0]:sel,c=B.chars[id];
  const rel=(c.fx&&ready(id)?c.rels.filter(r=>r.to&&B.chars[r.to]).map(r=>[r.to,r.type]):(c.rel||[]).filter(([x])=>B.chars[x])).slice(0,10);
  return {center:id,rel};
}
function renderGraph(){
  const g=$('#graph'),d=graphData();
  if(!d){g.innerHTML='<div class="note">用模型分析后，这里会出现关系网</div>';return}
  if(!g.querySelector('svg')){g.innerHTML=`<svg viewBox="0 0 ${G.W} ${G.H}"><g id="gE"></g><g id="gN"></g></svg>`;G.nodes.clear();}
  const cx=G.W/2,cy=G.H/2,R=128,pos=new Map([[d.center,[cx,cy]]]);
  d.rel.forEach(([id],i)=>{const a=-Math.PI/2+i*2*Math.PI/d.rel.length;pos.set(id,[cx+R*Math.cos(a),cy+R*Math.sin(a)*.92])});
  // 线：先淡出，节点到位后再画
  const gE=$('#gE');gE.style.opacity=0;
  setTimeout(()=>{gE.innerHTML=d.rel.map(([id,t])=>{const [x1,y1]=pos.get(d.center),[x2,y2]=pos.get(id);
    return `<g class="ge"><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><text x="${(x1+x2)/2}" y="${(y1+y2)/2+4}">${esc(t)}</text></g>`}).join('');gE.style.opacity=1;},T(G.nodes.size?300:0));
  gE.style.transition=`opacity ${T(200)}ms`;
  const gN=$('#gN');
  for(const [id,el] of G.nodes)if(!pos.has(id)){el.dataset.dead=1;el.style.opacity=0;setTimeout(()=>{if(el.dataset.dead){el.remove();if(G.nodes.get(id)===el)G.nodes.delete(id)}},T(340));}
  for(const [id,[x,y]] of pos){
    let el=G.nodes.get(id);const c=B.chars[id],big=id===d.center,r=big?30:21;
    if(!el){el=document.createElementNS('http://www.w3.org/2000/svg','g');el.setAttribute('class','gn');el.setAttribute('tabindex','0');el.setAttribute('role','button');el.setAttribute('aria-label',c.n);
      el.style.transform=`translate(${cx}px,${cy}px)`;el.style.opacity=0;gN.appendChild(el);G.nodes.set(id,el);
      el.onclick=()=>{select(id)};el.onkeydown=e=>{if(e.key==='Enter'||e.key===' ')select(id)};void el.getBoundingClientRect();}
    delete el.dataset.dead;
    el.innerHTML=`<circle r="${r}" style="fill:hsl(${c.h} var(--av-s) var(--av-l))"/><text class="glyph" style="fill:hsl(${c.h} var(--avt-s) var(--avt-l));font-size:${big?20:14}px">${esc(c.a)}</text><text y="${r+16}">${esc(c.n)}</text>`;
    requestAnimationFrame(()=>{el.style.transform=`translate(${x}px,${y}px)`;el.style.opacity=1;});
  }
}

      ${(r.att||[]).length?'<h3>前后变化</h3>':''}${(r.att||[]).map(a=>`<div class="att"><div class="lead">${esc(a.v)}</div><p class="det">${qhtml(a.d)}</p><div class="srcs" style="margin-top:8px">${srcBtn(a.c)}</div></div>`).join('')}
      ${(r.sc||[]).length?`<h3>对白</h3>${r.sc.map(x=>`<div class="scene"><div class="ctx">${esc(x.ctx)}</div><div class="say">${esc(x.q)}</div><div class="ft"><span>${esc(x.who)}</span>${srcBtn(x.c)}</div></div>`).join('')}`:''}
      ${r.to?`<h3>${esc(B.chars[r.to].n)}</h3><button class="rrow press" data-goto="${r.to}">${avHTML(r.to)}<div class="rt"><b>打开角色卡</b></div>${CHEV}</button>`:''}`;
  }else if(v.k==='ch'){
    const c=B.chapters[v.i];
    el.innerHTML=B.chars&&c.sum?`<div class="lead" style="font-size:19px">${esc(c.t[0])}<br>${esc(c.t[1])}</div><p class="det">${esc(c.sum)}</p>

    if(t.dataset.act&&moreAct(t))return;

    if(t.dataset.act==='file'){hideSheet(true);pickFile();}
    else if(t.dataset.act==='demo')loadDemo();
    else if(t.dataset.ch)go({k:'ch',i:+t.dataset.ch-1});
    else if(t.dataset.goto){hideSheet();setTimeout(()=>{if(tab===2)setTab(0);select(t.dataset.goto)},T(120));}
  });
  return el;

/* ================= 文件读取与切章 ================= */
function decode(buf){try{return new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){return new TextDecoder('gb18030').decode(buf)}}
/**
 * 切章：第X章/回/节/卷、Chapter N、序章/楔子/尾声/番外 各占一行算章节名；
 * 每章记下标题所在行号（line），分析时按行号取正文、找原句所在章。
 * 一个章节名都没有：按 5000 字左右在行尾切段。
 */
function splitChapters(text){
  const lines=text.replace(/\r\n?/g,'\n').split('\n');
  const re=/^[ \t　]*((?:第[0-9０-９零〇一二三四五六七八九十百千两]+[章回节卷集部篇]|chapter\s*\d+|序章|序言|楔子|引子|尾声|后记|番外)[^\n]{0,30})[ \t　]*$/i;
  const heads=[];
  lines.forEach((l,i)=>{const m=l.match(re);if(m&&l.length<=40)heads.push({i,t:m[1].trim()})});
  const out=[];
  if(!heads.length){
    let start=0,acc=0;
    lines.forEach((l,i)=>{acc+=l.replace(/\s/g,'').length;if(acc>=5000||i===lines.length-1){out.push({t:[`第 ${out.length+1} 段`,''],wc:acc,line:start,head:false,cast:[]});start=i+1;acc=0}});
    return {chapters:out.length?out:[{t:['（空文件）',''],wc:0,line:0,head:false,cast:[]}],unit:'段'};
  }
  // 章节名之前还有一大段（序、引子没写标题）：单独算一章
  const pre=lines.slice(0,heads[0].i).join('').replace(/\s/g,'').length;
  if(pre>800)out.push({t:['开篇',''],wc:pre,line:0,head:false,cast:[]});
  heads.forEach((h,k)=>{
    const end=k+1<heads.length?heads[k+1].i:lines.length;
    const wc=lines.slice(h.i+1,end).join('').replace(/\s/g,'').length;
    const sp=h.t.match(/^(第\S+?[章回节卷集部篇]|chapter\s*\d+)\s*(.*)$/i);
    let title=sp?(sp[2]||sp[1]):h.t,sub='';
    // 回目两句（甄士隐梦幻识通灵　贾雨村风尘怀闺秀）分两行
    const two=title.split(/[ \t　]{1,}/).filter(Boolean);
    if(two.length===2&&two[0].length>=4&&two[1].length>=4){title=two[0];sub=two[1]}
    out.push({t:[title,sub],wc,line:h.i,head:true,cast:[]});
  });
  const hui=heads.filter(h=>/第\S+?回/.test(h.t)).length;
  return {chapters:out,unit:hui>heads.length/2?'回':'章'};
}
async function epubText(f){
  const buf=new Uint8Array(await f.arrayBuffer());const dv=new DataView(buf.buffer);
  let eocd=buf.length-22;while(eocd>0&&dv.getUint32(eocd,true)!==0x06054b50)eocd--;
  let p=dv.getUint32(eocd+16,true);const n=dv.getUint16(eocd+10,true);const files=[];
  for(let k=0;k<n;k++){const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);
    files.push({name:new TextDecoder().decode(buf.subarray(p+46,p+46+nl)),method,csize,off});p+=46+nl+xl+cl;}
  let text='';
  for(const fi of files.filter(x=>/\.x?html?$/i.test(x.name)).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}))){
    const lh=fi.off,ln=dv.getUint16(lh+26,true),lx=dv.getUint16(lh+28,true);const raw=buf.subarray(lh+30+ln+lx,lh+30+ln+lx+fi.csize);
    const data=fi.method===0?raw:new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
    const doc=new DOMParser().parseFromString(new TextDecoder().decode(data),'text/html');
    doc.querySelectorAll('h1,h2,h3,h4,p').forEach(x=>x.append('\n'));text+='\n'+doc.body.textContent;}
  return text;
}

  back(){ if(isOpen){ if(stack.length>1)go(null,true); else hideSheet(); return true; } return false; },
  /** 选好的文件已经读成文字存好：{ok,id,name} 或 {ok:false,why}；null 是没选。 */
  async picked(r){
    if(!r)return;

  },

};
