<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>拆书 · 原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --k:1;
  --standard:cubic-bezier(.2,0,0,1);
  --decel:cubic-bezier(.05,.7,.1,1);
  --accel:cubic-bezier(.3,0,.8,.15);
  --tap:calc(var(--k)*80ms);
  --quick:calc(var(--k)*180ms);
  --base:calc(var(--k)*320ms);
  --emph:calc(var(--k)*420ms);
}
[data-skin=dark]{
  --page:#141414; --rail:#101010; --card:#1E1E1E; --press:#262626; --pop:#232325;
  --ink:#ECECEC; --muted:#9A9A9A; --faint:#5c5c5c; --line:rgba(255,255,255,.09);
  --accent:#E9B48E; --on-accent:#2A211B; --scrim:rgba(0,0,0,.5);
  --av-l:26%; --av-s:22%; --avt-l:80%; --avt-s:45%;
}
[data-skin=light]{
  --page:#F4F3EE; --rail:#ECEBE5; --card:#FAF9F5; --press:#E8E7E1; --pop:#FFFFFF;
  --ink:#1B1B19; --muted:#77766F; --faint:#b9b8b0; --line:rgba(0,0,0,.08);
  --accent:#C4875C; --on-accent:#FFFFFF; --scrim:rgba(20,20,18,.28);
  --av-l:90%; --av-s:30%; --avt-l:34%; --avt-s:35%;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#0b0b0b;font-family:"DM Sans",-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
body[data-skin=light]{background:#dcdbd5}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.4;pointer-events:none}

/* 聊天页 */
#chat{flex-direction:column;background:#1a1a1a}
body[data-skin=light] #chat{background:#F4F3EE}
.cbar{display:flex;align-items:center;height:56px;padding:0 6px;margin-top:env(safe-area-inset-top)}
.who{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15.5px}
.who b{font-weight:500}
.me.sm{width:26px;height:26px}
.msgs{flex:1;overflow-y:auto;padding:14px 16px 20px;display:flex;flex-direction:column;gap:14px}
.msg.u{align-self:flex-end;max-width:80%;background:var(--card);padding:10px 14px;border-radius:18px 18px 6px 18px;font-size:15px;line-height:1.6}
.msg.a{font-size:15.5px;line-height:1.95;opacity:0;transform:translateY(6px);transition:opacity var(--base) var(--decel),transform var(--base) var(--decel)}
.msg.a.in{opacity:1;transform:none}
.tools{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.tc{align-self:flex-start;display:flex;align-items:center;gap:8px;height:32px;padding:0 12px 0 10px;border-radius:16px;background:var(--card);font-size:13px;color:var(--muted);
  opacity:0;transform:translateY(4px);transition:opacity var(--quick) var(--decel),transform var(--base) var(--decel)}
.tc.in{opacity:1;transform:none}
.tc b{color:var(--ink);font-weight:500}
.tc .st{width:14px;height:14px;position:relative}
.tc .st i{position:absolute;inset:0;border-radius:50%;border:1.6px solid var(--faint);border-top-color:var(--accent);animation:spin calc(var(--k)*.8s) linear infinite;transition:opacity var(--quick)}
.tc .st svg{position:absolute;inset:0;width:14px;height:14px;stroke:var(--accent);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset var(--base) var(--decel)}
.tc.ok .st i{opacity:0}
.tc.ok .st svg{stroke-dashoffset:0}
@keyframes spin{to{transform:rotate(360deg)}}
.inbar{display:flex;align-items:center;gap:8px;padding:8px 10px calc(10px + env(safe-area-inset-bottom))}
.plus,.send{flex:none;width:42px;height:42px;border-radius:21px;display:grid;place-items:center;background:var(--card);transition:transform var(--base) var(--standard),background-color var(--quick)}
.plus:active,.send:active{transform:scale(.92);transition-duration:var(--tap)}
.plus svg,.send svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform var(--base) var(--standard)}
.plus[aria-expanded=true] svg{transform:rotate(45deg)}
.send{background:var(--ink)} .send svg{stroke:var(--page)}
.field{flex:1;height:42px;border-radius:21px;background:var(--card);display:flex;align-items:center;padding:0 16px;font-size:15px;color:var(--faint)}
/* ＋ 面板（照 Kelivo：三格 + 工具行） */
.ptiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.ptile{height:76px;border-radius:16px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12.5px;color:var(--muted)}
.ptile:active{background:var(--press);transform:scale(.96)}
.ptile svg,.prow svg.pi{width:21px;height:21px;stroke:var(--ink);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.prow{display:flex;align-items:center;gap:14px;width:100%;height:52px;padding:0 12px;border-radius:14px;text-align:left;font-size:15px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.prow:active{background:var(--card);transform:scale(.98)}
.prow span{flex:1}
.prow em{font-style:normal;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.prow.hot em{color:var(--accent)}
.bkrow{display:flex;align-items:center;gap:14px;padding:10px 4px}
.bkrow .cv{flex:none;width:38px;height:52px;border-radius:3px 6px 6px 3px;display:flex;justify-content:center;padding-top:6px;color:rgba(255,255,255,.88);font-size:10px;writing-mode:vertical-rl;letter-spacing:.2em;box-shadow:inset 3px 0 0 rgba(0,0,0,.18)}
.bkrow .t{flex:1;min-width:0}
.bkrow b{display:block;font-size:15.5px;font-weight:500}
.bkrow span{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}
.hint{font-size:12.5px;color:var(--muted);line-height:1.7;padding:6px 4px 18px}
.ibtn.light svg{stroke:#f2ede6}
body[data-skin=light] .ibtn.light svg{stroke:var(--ink)}

/* 页面 */
.pg{position:absolute;inset:0;display:flex;background:var(--page);transition:transform var(--emph) var(--decel),background-color var(--base)}
.pg::after{content:"";position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity var(--emph) var(--decel)}
#mod{overflow:hidden}
.pg.off{transform:translateX(100%);pointer-events:none;box-shadow:-20px 0 40px rgba(0,0,0,.2)}
.pg.under{transform:translateX(-22%);pointer-events:none}
.pg.under::after{opacity:.35}
.app.back .pg,.app.back .pg::after{transition-duration:calc(var(--k)*300ms);transition-timing-function:var(--accel)}
/* 我的（透明磨砂） */
#mine{flex-direction:column;background:radial-gradient(120% 60% at 70% 20%,#4a4038 0%,transparent 60%),radial-gradient(90% 60% at 10% 80%,#3a3226 0%,transparent 60%),#2a2e36}
body[data-skin=light] #mine{background:radial-gradient(120% 60% at 70% 20%,#e9ddd0 0%,transparent 60%),#eceae4}
.mbar{height:56px;padding:0 6px;margin-top:env(safe-area-inset-top);display:flex;align-items:center}
.mbar2{display:flex;align-items:center;gap:14px;padding:4px 22px 18px}
.me{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#c9a58a,#6e5848)}
.mbar2 h1{font-size:24px;font-weight:500;letter-spacing:.1em;color:#f2ede6}
body[data-skin=light] .mbar2 h1{color:var(--ink)}
.mscroll{flex:1;overflow-y:auto;padding:0 14px 60px}
.mscroll::-webkit-scrollbar{display:none}
.mlabel{font-size:12.5px;letter-spacing:.2em;color:rgba(242,237,230,.55);margin:22px 8px 10px}
body[data-skin=light] .mlabel{color:var(--muted)}
.mrow{display:flex;align-items:center;gap:14px;min-height:70px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.06);margin-bottom:8px;color:#f2ede6;
  transition:background-color var(--quick) var(--standard),transform var(--quick) var(--standard)}
body[data-skin=light] .mrow{background:rgba(255,255,255,.6);color:var(--ink)}
button.mrow{width:100%;text-align:left}
.mrow:active{background:rgba(255,255,255,.1);transform:scale(.98)}
.mbody{flex:1;min-width:0;display:flex;align-items:center;gap:14px;text-align:left;align-self:stretch;margin:-12px 0 -12px -14px;padding:12px 0 12px 14px;border-radius:16px}
.mi{flex:none;width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.08);display:grid;place-items:center;color:#E9B48E;font-size:18px}
body[data-skin=light] .mi{background:rgba(0,0,0,.05);color:#C4875C}
.mi svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mt{flex:1;min-width:0}
.mt b{display:block;font-size:16px;font-weight:500}
.mt span{display:block;font-size:13px;color:rgba(242,237,230,.55);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity var(--quick)}
body[data-skin=light] .mt span{color:var(--muted)}
.mv{font-size:13.5px;color:rgba(242,237,230,.55)}
body[data-skin=light] .mv{color:var(--muted)}
/* 开关（照 KSwitch：52×32，按下拉长滑块） */
.sw{flex:none;position:relative;width:52px;height:32px;border-radius:16px;background:rgba(255,255,255,.14);transition:background-color calc(var(--k)*220ms) var(--standard)}
body[data-skin=light] .sw{background:rgba(0,0,0,.12)}
.sw::before{content:"";position:absolute;inset:-6px -4px}
.sw i{position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:12px;background:rgba(255,255,255,.55);
  transition:transform calc(var(--k)*260ms) cubic-bezier(.3,1.35,.5,1),width calc(var(--k)*120ms) var(--standard),background-color calc(var(--k)*220ms) var(--standard)}
.sw:active i{width:28px}
.sw[aria-checked=true]{background:#E9B48E}
body[data-skin=light] .sw[aria-checked=true]{background:#C4875C}
.sw[aria-checked=true] i{transform:translateX(20px);background:#2A211B}
.sw[aria-checked=true]:active i{transform:translateX(16px)}
body[data-skin=light] .sw[aria-checked=true] i{background:#fff}
/* 书名即切换按钮 */
.bt{display:flex;align-items:center;gap:6px;max-width:100%;text-align:left;margin-left:-6px;padding:2px 6px;border-radius:10px}
.bt:active{background:var(--card);transform:scale(.98)}
.bt .dn{flex:none;width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bt .bn{flex:none;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
/* 书架弹层 */
.bk{display:flex;align-items:center;gap:14px;width:100%;padding:10px 8px;border-radius:14px;text-align:left}
.bk:active{background:var(--card);transform:scale(.98)}
.bk .cv{flex:none;width:38px;height:52px;border-radius:3px 6px 6px 3px;display:flex;justify-content:center;padding-top:6px;color:rgba(255,255,255,.88);font-size:10px;writing-mode:vertical-rl;letter-spacing:.2em;box-shadow:inset 3px 0 0 rgba(0,0,0,.18)}
.bk .t{flex:1;min-width:0}
.bk b{display:block;font-size:15.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk span{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}
.bk .ck{flex:none;width:20px;height:20px;stroke:var(--accent);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.6);transition:opacity var(--quick),transform var(--base) var(--decel)}
.bk[aria-current=true] .ck{opacity:1;transform:none}
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.app{position:relative;width:100%;height:100%;background:var(--page);overflow:hidden;overflow:clip;display:flex;transition:background-color var(--base) var(--standard)}
@media (min-width:560px){.app{width:390px;height:min(844px,calc(100vh - 48px));border-radius:44px;box-shadow:0 0 0 10px #000,0 30px 80px rgba(0,0,0,.5)}}

.press{transition:transform var(--quick) var(--standard),background-color var(--quick) var(--standard),opacity var(--quick) var(--standard)}
.press:active{transform:scale(.97);transition-duration:var(--tap)}

/* ---------- 左侧角色栏 ---------- */
.rail{flex:none;width:58px;background:var(--rail);display:flex;flex-direction:column;padding-top:calc(64px + env(safe-area-inset-top));z-index:1;
  transform:translateX(-100%);transition:transform var(--emph) var(--decel),background-color var(--base)}
.app.has-book .rail{transform:none}
.rail-in{position:relative;flex:1;overflow-y:auto;padding:4px 0 40px;display:flex;flex-direction:column;align-items:center;gap:6px}
.rail-in::-webkit-scrollbar{display:none}
.rail-ind{position:absolute;left:7px;top:0;width:44px;height:44px;border-radius:14px;background:color-mix(in oklab,var(--accent) 20%,transparent);
  transition:transform var(--base) var(--standard),opacity var(--quick);pointer-events:none;opacity:0}
.ri{position:relative;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;
  opacity:0;transform:translateX(-8px)}
.ri.in{opacity:1;transform:none;transition:opacity var(--base) var(--decel),transform var(--base) var(--decel)}
.ri.in:active{transform:scale(.92);transition-duration:var(--tap)}
.ri .sq{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:15px;font-weight:500;
  background:hsl(var(--h) var(--av-s) var(--av-l));color:hsl(var(--h) var(--avt-s) var(--avt-l));transition:opacity var(--base) var(--standard),background-color var(--base),color var(--base)}
.ri.pend .sq{opacity:.38}
.ri.world .sq{background:var(--card);color:var(--accent)}
.ri.world .sq svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6}
.rail-sep{width:22px;height:1px;background:var(--line);margin:4px 0;flex:none}

/* ---------- 主区 ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.bar{display:flex;align-items:center;gap:2px;height:56px;padding:0 6px 0 4px;flex:none;margin-top:env(safe-area-inset-top)}
.ibtn{width:44px;height:44px;border-radius:22px;display:grid;place-items:center}
.ibtn:active{background:var(--press)}
.ibtn svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.chip-btn{height:34px;padding:0 14px;border-radius:17px;background:var(--ink);color:var(--page);font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip-btn:active{opacity:.8;transform:scale(.96)}
.chip-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:48px}
.scroll::-webkit-scrollbar{display:none}

/* 空状态：导入框 */
.drop{margin:40px 16px 0;border:1.5px dashed var(--faint);border-radius:22px;padding:34px 18px 26px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.drop .di{width:52px;height:52px;border-radius:16px;background:var(--card);display:grid;place-items:center;margin-bottom:6px}
.drop .di svg{width:24px;height:24px;stroke:var(--accent);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.drop b{font-size:16px;font-weight:600}
.drop small{font-size:12.5px;color:var(--muted)}
.drop .acts{display:flex;gap:8px;margin-top:16px}
.btn2{height:40px;padding:0 18px;border-radius:20px;background:var(--card);font-size:14px;font-weight:500}
.btn2:active{background:var(--press);transform:scale(.96)}
.btn2.pri{background:var(--ink);color:var(--page)}
.btn2.pri:active{opacity:.82}

/* 书目栏 */
.bookline{padding:0 16px}
.bt{display:flex;align-items:center;gap:8px}
.bt h1{font-size:22px;font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:11px;color:var(--accent);padding:2px 7px;border-radius:8px;background:color-mix(in oklab,var(--accent) 14%,transparent);flex:none}
.bs{font-size:12.5px;color:var(--muted);margin-top:5px;font-variant-numeric:tabular-nums}
.run{position:relative;margin-top:14px;width:100%;height:42px;border-radius:14px;background:color-mix(in oklab,var(--accent) 14%,transparent);color:var(--accent);
  font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px;overflow:hidden}
.run:active{transform:scale(.98);background:color-mix(in oklab,var(--accent) 22%,transparent)}
.run svg.star{width:16px;height:16px;fill:currentColor}
.run .lbl{transition:opacity var(--quick) var(--standard),transform var(--quick) var(--standard)}
.run .bar2{position:absolute;left:0;top:0;bottom:0;width:100%;background:color-mix(in oklab,var(--accent) 16%,transparent);transform-origin:left;transform:scaleX(0);transition:transform var(--base) var(--standard)}
.run.busy{pointer-events:none}
.run.done{opacity:0;transform:translateY(-6px);transition:opacity var(--base) var(--standard),transform var(--base) var(--standard);pointer-events:none}
.run-wrap{display:grid;grid-template-rows:1fr;transition:grid-template-rows var(--base) var(--standard)}
.run-wrap.gone{grid-template-rows:0fr}
.run-wrap>div{overflow:hidden}

.tabs{position:sticky;top:0;z-index:3;background:var(--page);padding:14px 16px 12px;transition:background-color var(--base)}
.seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);height:38px;background:var(--card);border-radius:19px;padding:3px}
.seg .knob{position:absolute;top:3px;left:3px;width:calc((100% - 6px)/3);height:32px;border-radius:16px;background:var(--pop);box-shadow:0 1px 3px rgba(0,0,0,.15);transition:transform var(--base) var(--standard)}
.seg button{position:relative;z-index:1;font-size:13.5px;font-weight:500;color:var(--muted);transition:color var(--quick)}
.seg button[aria-selected=true]{color:var(--ink)}
.pane{padding:0 16px;transition:opacity var(--quick) var(--standard),transform var(--quick) var(--standard)}
.pane[hidden]{display:none}
.pane.out-l{opacity:0;transform:translateX(-12px)} .pane.out-r{opacity:0;transform:translateX(12px)}

/* ---------- 角色卡 ---------- */
.cardwrap{transition:opacity var(--quick) var(--standard),transform var(--quick) var(--standard)}
.cardwrap.out-u{opacity:0;transform:translateY(-10px)} .cardwrap.out-d{opacity:0;transform:translateY(10px)}
.hero{display:flex;align-items:center;gap:14px;padding:16px;border-radius:20px;
  background:linear-gradient(135deg,color-mix(in oklab,var(--accent) 13%,var(--card)),var(--card) 70%)}
.hero .sq{width:54px;height:54px;border-radius:15px;display:grid;place-items:center;font-size:24px;font-weight:500;flex:none;
  background:hsl(var(--h) var(--av-s) var(--av-l));color:hsl(var(--h) var(--avt-s) var(--avt-l))}
.hero h2{font-size:21px;font-weight:600;display:flex;align-items:center;gap:8px}
.hero h2 .add{width:24px;height:24px;border-radius:12px;display:grid;place-items:center;font-size:16px;font-weight:400;color:var(--muted);background:var(--press)}
.hero p{font-size:12.5px;color:var(--muted);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips span{font-size:12.5px;padding:4px 10px;border-radius:12px;background:var(--card);color:var(--muted)}
.chips small{font-size:10.5px;color:var(--faint);margin-left:4px}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{position:relative;text-align:left;background:var(--card);border-radius:18px;padding:14px 14px 14px;min-height:124px;display:flex;flex-direction:column}
.tile:active,.tile.held{background:var(--press)}
.tile:active{transform:scale(.97)}
.tile .ti{width:22px;height:22px;stroke:var(--accent);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tile b{display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:600;margin-top:10px}
.tile b svg{width:14px;height:14px;stroke:var(--faint);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tile p{font-size:12.5px;color:var(--muted);line-height:1.55;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;transition:opacity var(--base) var(--standard)}
.tile .sk{margin-top:10px;display:grid;gap:6px}
.tile .sk i{height:7px;border-radius:4px;background:var(--line)}
.tile .sk i:last-child{width:60%}
.tile.wait .sk i{animation:breathe calc(var(--k)*1.1s) var(--standard) infinite alternate}
@keyframes breathe{from{opacity:.4}to{opacity:1}}

/* ================= 书架：多本书，存在本机 ================= */
const books=[];          // 已导入的书
const picks=new Set();  // 这个对话（跟随助理）勾上的书
const KEY='chaishu.v1';
function save(){
  try{localStorage.setItem(KEY,JSON.stringify({cur:B?.id||null,picks:[...picks],books:books.map(b=>b.sample
    ?{id:b.id,sample:true,analyzed:b.analyzed}
    :{id:b.id,title:b.title,chapters:b.chapters,wc:b.wc,analyzed:b.analyzed})}))}catch(e){}
}
function restore(){
  let d=null;try{d=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
  if(!d)return;
  (d.books||[]).forEach(x=>{
    const b=x.sample?makeDemo():{...x,chars:null,order:[]};
    b.id=x.id;b.analyzed=x.analyzed||0;books.push(b);
  });
  (d.picks||[]).forEach(id=>books.some(b=>b.id===id)&&picks.add(id));
  const cur=books.find(b=>b.id===d.cur)||books[0];
  if(cur)openBook(cur,true);
}
function addBook(b){b.id=b.id||Date.now().toString(36);books.unshift(b);save();}

/* ================= 关系网：选中的人在中间，点别人换中心 ================= */
const G={W:334,H:380,nodes:new Map()};
function graphData(){
  if(!B.chars)return null;
  const id=(!sel||sel==='world')?B.order[0]:sel,c=B.chars[id];
  const rel=c.fx&&ready(id)?c.rels.filter(r=>r.to).map(r=>[r.to,r.type]):c.rel;
  return {center:id,rel};
}
function renderGraph(){
  const g=$('#graph'),d=graphData();
  if(!d){g.innerHTML='<div class="note">用模型分析后，这里会出现关系网</div>';return}
  if(!g.querySelector('svg')){g.innerHTML=`<svg viewBox="0 0 ${G.W} ${G.H}"><g id="gE"></g><g id="gN"></g></svg>`;G.nodes.clear();}
  const cx=G.W/2,cy=G.H/2,R=128,pos=new Map([[d.center,[cx,cy]]]);
  d.rel.forEach(([id],i)=>{const a=-Math.PI/2+i*2*Math.PI/d.rel.length;pos.set(id,[cx+R*Math.cos(a),cy+R*Math.sin(a)*.92])});
  // 线：先淡出，节点到位后再画
  const gE=$('#gE');gE.style.opacity=0;
  setTimeout(()=>{gE.innerHTML=d.rel.map(([id,t])=>{const [x1,y1]=pos.get(d.center),[x2,y2]=pos.get(id);
    return `<g class="ge"><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><text x="${(x1+x2)/2}" y="${(y1+y2)/2+4}">${esc(t)}</text></g>`}).join('');gE.style.opacity=1;},T(G.nodes.size?300:0));
  gE.style.transition=`opacity ${T(200)}ms`;
  const gN=$('#gN');
  for(const [id,el] of G.nodes)if(!pos.has(id)){el.dataset.dead=1;el.style.opacity=0;setTimeout(()=>{if(el.dataset.dead){el.remove();if(G.nodes.get(id)===el)G.nodes.delete(id)}},T(340));}
  for(const [id,[x,y]] of pos){
    let el=G.nodes.get(id);const c=B.chars[id],big=id===d.center,r=big?30:21;
    if(!el){el=document.createElementNS('http://www.w3.org/2000/svg','g');el.setAttribute('class','gn');el.setAttribute('tabindex','0');el.setAttribute('role','button');el.setAttribute('aria-label',c.n);
      el.style.transform=`translate(${cx}px,${cy}px)`;el.style.opacity=0;gN.appendChild(el);G.nodes.set(id,el);
      el.onclick=()=>{select(id)};el.onkeydown=e=>{if(e.key==='Enter'||e.key===' ')select(id)};void el.getBoundingClientRect();}
    delete el.dataset.dead;
    el.innerHTML=`<circle r="${r}" style="fill:hsl(${c.h} var(--av-s) var(--av-l))"/><text class="glyph" style="fill:hsl(${c.h} var(--avt-s) var(--avt-l));font-size:${big?20:14}px">${esc(c.a)}</text><text y="${r+16}">${esc(c.n)}</text>`;
    requestAnimationFrame(()=>{el.style.transform=`translate(${x}px,${y}px)`;el.style.opacity=1;});
  }
}

const scrim=$('#scrim'),sheet=$('#sheet');
let isOpen=false,opener=null,stack=[];
function title(v){
  if(v.k==='import')return '导入小说';
  if(v.k==='books')return '书架';
  if(v.k==='plus')return '';
  if(v.k==='pick')return `拆书 (${books.filter(b=>picks.has(b.id)).length}/${books.length})`;
  if(v.k==='field')return {basic:'基础资料',build:'外貌身形',bg:'身份背景',pers:'性格与行为'}[v.f];
  if(v.k==='rel'){const r=B.chars[v.id].rels[v.r];return `${B.chars[v.id].n} → ${relName(r)}`}
  if(v.k==='ch')return B.chars?`第${cnNum(v.i+1)}回`:`第 ${v.i+1} 章`;
}
function openSheet(v,op){
  stack=[v];opener=op;
  const body=$('#sbody');body.innerHTML='';body.appendChild(view(v));
  $('#sTitle').textContent=title(v);$('#sBack').classList.remove('on');
  sheet.style.height=['import','books','plus','pick'].includes(v.k)?'auto':'';
  $('#plus').setAttribute('aria-expanded',v.k==='plus'||v.k==='pick');
  sheet.classList.remove('closing','drag');sheet.style.transform='';sheet.setAttribute('aria-hidden','false');
  scrim.classList.remove('closing');void sheet.offsetWidth;
  sheet.classList.add('on');scrim.classList.add('on');isOpen=true;
  op?.classList.add('held');
  setTimeout(()=>$('#sClose').focus({preventScroll:true}),T(60));
}
function hideSheet(silent){
  if(!isOpen)return;isOpen=false;$('#plus').setAttribute('aria-expanded',false);
  sheet.classList.remove('drag');sheet.style.transform='';
  sheet.classList.add('closing');sheet.classList.remove('on');sheet.setAttribute('aria-hidden','true');
  scrim.classList.add('closing');scrim.classList.remove('on');
  const op=opener;setTimeout(()=>op?.classList.remove('held'),silent?0:T(200));
  if(!silent&&op&&document.contains(op))op.focus({preventScroll:true});
}
function go(v,back){
  if(back)stack.pop();else stack.push(v);
  const cur=stack[stack.length-1],body=$('#sbody'),old=body.lastElementChild;
  old.classList.add(back?'leave-r':'leave-l');setTimeout(()=>old.remove(),T(200));
  const nv=view(cur);nv.classList.add(back?'from-l':'from-r');body.appendChild(nv);void nv.offsetWidth;
  setTimeout(()=>nv.classList.remove('from-l','from-r'),T(40));
  const h=$('#sTitle');h.style.opacity=0;setTimeout(()=>{h.textContent=title(cur);h.style.opacity=1},T(120));
  $('#sBack').classList.toggle('on',stack.length>1);
}
scrim.onclick=()=>hideSheet();
$('#sClose').onclick=()=>hideSheet();
$('#sBack').onclick=()=>stack.length>1&&go(null,true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&isOpen)hideSheet()});
(()=>{const g=sheet.querySelector('.grab');let y0=0,dy=0,t0=0,on=false;
  g.addEventListener('pointerdown',e=>{if(!isOpen)return;on=true;y0=e.clientY;dy=0;t0=performance.now();g.setPointerCapture(e.pointerId);sheet.classList.add('drag')});
  g.addEventListener('pointermove',e=>{if(!on)return;dy=Math.max(0,e.clientY-y0);sheet.style.transform=`translateY(${dy}px)`;scrim.style.opacity=1-dy/sheet.offsetHeight});
  const up=()=>{if(!on)return;on=false;sheet.classList.remove('drag');scrim.style.opacity='';
    if(dy>sheet.offsetHeight*.28||dy/(performance.now()-t0)>.6)hideSheet();else sheet.style.transform=''};
  g.addEventListener('pointerup',up);g.addEventListener('pointercancel',up);})();

function view(v){
  const el=document.createElement('div');el.className='view';

    const P=(d)=>`<svg class="pi" viewBox="0 0 24 24">${d}</svg>`;

/* ================= 文件读取与切章 ================= */
function decode(buf){try{return new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){return new TextDecoder('gb18030').decode(buf)}}
function splitChapters(text){
  const re=/^[ \t　]*((?:第[0-9零〇一二三四五六七八九十百千两]+[章回节卷集部篇]|chapter\s*\d+|序章|序言|楔子|引子|尾声|后记|番外)[^\n]{0,30})[ \t　]*$/gim;
  const hits=[];let m;while((m=re.exec(text)))hits.push({i:m.index,t:m[1].trim(),end:re.lastIndex});
  const out=[];
  if(!hits.length){const body=text.replace(/\s+/g,'');for(let i=0;i<body.length;i+=5000)out.push({t:[`第 ${out.length+1} 段`,''],wc:Math.min(5000,body.length-i),cast:[]});
    return out.length?out:[{t:['（空文件）',''],wc:0,cast:[]}];}
  hits.forEach((h,k)=>{const body=text.slice(h.end,k+1<hits.length?hits[k+1].i:text.length);
    const sp=h.t.match(/^(第\S+?[章回节卷集部篇]|chapter\s*\d+)\s*(.*)$/i);
    out.push({t:[sp?(sp[2]||sp[1]):h.t,''],wc:body.replace(/\s/g,'').length,cast:[]});});
  return out;
}
async function epubText(f){
  const buf=new Uint8Array(await f.arrayBuffer());const dv=new DataView(buf.buffer);
  let eocd=buf.length-22;while(eocd>0&&dv.getUint32(eocd,true)!==0x06054b50)eocd--;
  let p=dv.getUint32(eocd+16,true);const n=dv.getUint16(eocd+10,true);const files=[];
  for(let k=0;k<n;k++){const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);
    files.push({name:new TextDecoder().decode(buf.subarray(p+46,p+46+nl)),method,csize,off});p+=46+nl+xl+cl;}
  let text='';
  for(const fi of files.filter(x=>/\.x?html?$/i.test(x.name)).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}))){
    const lh=fi.off,ln=dv.getUint16(lh+26,true),lx=dv.getUint16(lh+28,true);const raw=buf.subarray(lh+30+ln+lx,lh+30+ln+lx+fi.csize);
    const data=fi.method===0?raw:new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
    const doc=new DOMParser().parseFromString(new TextDecoder().decode(data),'text/html');
    doc.querySelectorAll('h1,h2,h3,p,br,div').forEach(x=>x.append('\n'));text+='\n'+doc.body.textContent;}
  return text;
}
