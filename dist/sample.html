<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f6f0">
<title>殷洛妍 · 小说分析</title>
<style>
:root{color-scheme:light;--paper:#f7f6f0;--panel:#fffef9;--ink:#232c29;--sub:#545e58;--muted:#697069;--red:#963e32;--line:#d4d6ca;--pale:#edece3;--serif:"Songti SC","Noto Serif CJK SC","Noto Serif SC","Source Han Serif CN","STSong","SimSun",serif;--sans:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font:16px/1.76 var(--sans)}button,a,summary{touch-action:manipulation}button,summary{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--red);outline-offset:4px}button{color:inherit}a{color:var(--red)}[hidden]{display:none!important}
.bar{background:var(--panel);border-bottom:1px solid var(--line)}.shell{max-width:1100px;margin:auto;padding:0 36px}.bar .shell{height:68px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:11px;font:700 22px/1 var(--serif);letter-spacing:.12em}.mark{display:block;width:27px;height:30px;border:1.5px solid var(--red);border-radius:3px 1px 2px 2px;color:var(--red);font:700 20px/27px var(--serif);text-align:center;letter-spacing:0}.app-link{color:var(--ink);font-size:14px;text-decoration:none;border-bottom:1px solid #a9b0a4;padding:3px 0}.app-link:hover{color:var(--red);border-color:currentColor}
.hero{padding:45px 0 32px}.hero-grid{display:grid;grid-template-columns:minmax(0,1.72fr) minmax(210px,.75fr);gap:46px;align-items:end}.bookline{display:flex;align-items:center;gap:14px;color:var(--sub);font-size:14px;letter-spacing:.06em}.sample{display:inline-block;border:1px solid #b88879;color:var(--red);font-size:13px;line-height:1.6;padding:0 6px;border-radius:2px;letter-spacing:.07em}.book{font:600 17px var(--serif);letter-spacing:.06em}h1{font:600 clamp(48px,6.5vw,78px)/1.14 var(--serif);letter-spacing:.05em;margin:16px 0 9px}#subtitle{margin:0;color:var(--sub);font-size:16px}.intro{border-left:2px solid #ad705c;font:400 18px/1.85 var(--serif);padding-left:18px;margin:0;max-width:32em}
.tabs{border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;gap:34px}.tabs button{border:0;background:transparent;color:var(--sub);padding:12px 2px 10px;position:relative;font-size:16px;font-weight:600;min-height:48px}.tabs button[aria-selected=true]{color:var(--red)}.tabs button[aria-selected=true]::after{content:"";height:3px;background:var(--red);position:absolute;left:0;right:0;bottom:-1px}.count{font-size:13px;font-weight:400;margin-left:6px;color:var(--sub)}
.work{display:grid;grid-template-columns:minmax(0,1.72fr) minmax(220px,.75fr);gap:46px;margin-top:34px;margin-bottom:70px}.section+.section{margin-top:32px}.section-title,.rail-title{margin:0 0 14px;font:600 25px/1.4 var(--serif);letter-spacing:.055em}.facts{margin:0;border-top:1px solid var(--line)}.fact{display:grid;grid-template-columns:6em 1fr;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}dt{font-weight:600;color:var(--sub)}dd{margin:0}.ref{background:transparent;border:0;border-bottom:1px dotted #ad877a;color:var(--red);font-size:13px;line-height:1.4;white-space:nowrap;padding:1px 0;margin-left:8px}.ref:hover{border-bottom-style:solid}.trait{position:relative;padding:15px 0 15px 17px;border-bottom:1px solid var(--line)}.trait:before{content:"";position:absolute;left:1px;top:24px;width:5px;height:5px;background:var(--red);transform:rotate(45deg)}.trait h3{margin:0 0 2px;font-size:17px}.trait p,.reltext,.basis{margin:0}
.rail{border:1px solid var(--line);border-top:2px solid var(--ink);padding:17px 20px 9px;background:var(--panel);align-self:start}.rail-title{font-size:19px;margin-bottom:9px}.quick{display:flex;width:100%;align-items:baseline;justify-content:space-between;gap:10px;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;padding:12px 0}.quick:hover{color:var(--red)}.quick strong{font:600 17px var(--serif)}.quick small{font-size:13px;color:var(--sub)}.rel{scroll-margin-top:12px;border-top:2px solid var(--ink);padding-top:14px}.rel+.rel{margin-top:34px}.relhead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.relhead h3{font:600 23px/1.45 var(--serif);margin:0}.kin{font-size:14px;color:var(--sub)}.reltext{margin:8px 0 4px;font:500 18px/1.65 var(--serif)}.basis{color:var(--sub);font-size:15px;line-height:1.8}.scene{margin-top:14px;background:var(--panel);border:1px solid var(--line)}.scene summary{cursor:pointer;font-weight:600;font-size:15px;padding:11px 14px}.scene summary::marker{color:var(--red)}.scene summary span{font-weight:400;font-size:13px;color:var(--muted);margin-right:8px}.excerpt{border-top:1px solid var(--line);padding:12px 15px}.excerpt p{font:400 17px/1.8 var(--serif);margin:0 0 12px;white-space:pre-line}.excerpt p:last-child{margin-bottom:0}.locator{color:var(--sub);font:400 13px/1.5 var(--sans);display:block;margin-bottom:3px}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-top:3px solid var(--red);border-radius:2px;width:min(550px,calc(100% - 28px));max-height:78vh;padding:21px 25px;box-shadow:0 20px 80px #16201b35}dialog::backdrop{background:#19241d55}.dialoghead{display:flex;align-items:center;justify-content:space-between;gap:12px}.dialoghead h2{font:600 24px var(--serif);margin:0}.close{border:1px solid var(--line);background:transparent;border-radius:3px;padding:4px 11px;font-size:14px}.proof{border-top:1px solid var(--line);padding-top:12px;margin:14px 0 2px}.proof blockquote{font:400 18px/1.8 var(--serif);margin:4px 0;white-space:pre-line}.proof div{font-size:13px;color:var(--red)}footer a{font-size:14px;color:var(--red);text-underline-offset:3px}footer p{margin:4px 0}footer{border-top:1px solid var(--line);padding:15px 0 30px;color:var(--muted);font-size:13px}
@media(max-width:760px){.shell{padding:0 20px}.bar .shell{height:55px}.brand{font-size:20px}.mark{width:25px;height:27px;line-height:24px;font-size:18px}.hero{padding:26px 0 21px}.hero-grid{display:block}h1{margin:10px 0 4px}.intro{margin-top:17px;font-size:16px;line-height:1.8;padding-left:12px}.work{grid-template-columns:minmax(0,1fr);gap:28px;margin:24px 0 38px}.tabs{gap:26px}.section-title{font-size:23px}.fact{grid-template-columns:4.3em minmax(0,1fr);padding:11px 0}.rail{max-width:none}.book{font-size:16px}.app-link{font-size:14px}}@media(max-width:355px){.shell{padding:0 14px}.fact{grid-template-columns:3.6em minmax(0,1fr)}}@media(prefers-reduced-motion:no-preference){button,a,summary{transition:color .14s,border-color .14s}}
</style>
</head>
<body>
<header class="bar"><div class="shell"><div class="brand"><span class="mark" aria-hidden="true">析</span>小说分析</div><a class="app-link" href="./index.html">导入自己的小说</a></div></header>
<main class="shell">
<section class="hero" aria-labelledby="name"><div class="hero-grid"><div><div class="bookline"><span class="book">《仙宫香妃录》</span><span class="sample">原文校读样卡</span></div><h1 id="name">殷洛妍</h1><p id="subtitle"></p><a href="./extraction.html" style="display:inline-block;margin-top:9px;text-underline-offset:3px;font-size:14px">对照自动提取结果</a></div><p class="intro" id="intro"></p></div></section>
<div class="tabs" role="tablist" aria-label="阅读内容"><button type="button" id="tab-card" role="tab" aria-controls="card" aria-selected="true">角色卡</button><button type="button" id="tab-rel" role="tab" aria-controls="relations" aria-selected="false" tabindex="-1">关系与对白<span class="count" id="relcount"></span></button></div>
<div class="work"><div>
<section role="tabpanel" id="card" aria-labelledby="tab-card"><section class="section"><h2 class="section-title">人物小传</h2><dl class="facts" id="facts"></dl></section><section class="section"><h2 class="section-title">性格与处事</h2><div id="traits"></div></section></section>
<section role="tabpanel" id="relations" aria-labelledby="tab-rel" hidden><h2 class="section-title">她与书中人</h2><div id="relbody"></div></section>
</div><aside class="rail" aria-labelledby="rail-title"><h2 class="rail-title" id="rail-title">关系速览</h2><div id="quicklinks"></div></aside></div>
<footer><p>《仙宫香妃录》 · 本样卡的引文保留原文件行号。</p><p><a href="./extraction.html">查看同一本书的自动提取结果</a></p></footer>
</main>
<dialog id="source" aria-labelledby="source-title"><div class="dialoghead"><h2 id="source-title">原文依据</h2><button class="close" type="button" id="close">关闭</button></div><div id="proofs"></div></dialog>
<script src="./evidence.js"></script>
<script>
(() => {
  const data = globalThis.folioData;
  const id = name => document.getElementById(name);
  const make = (tag, className, value) => {
    const element = document.createElement(tag);
    if (className) element.className = className;
    if (value !== undefined) element.textContent = value;
    return element;
  };
  if (!data) {
    id('intro').textContent = '样卡资料未能载入，请重新打开预览。';
    return;
  }
  document.title = data.name + ' · 小说分析';
  id('name').textContent = data.name;
  id('subtitle').textContent = data.subtitle;
  id('intro').textContent = data.summary;
  id('relcount').textContent = data.relations.length;
  const dialog = id('source');
  const showSource = (lineRefs) => {
    const target = id('proofs');
    target.replaceChildren();
    lineRefs.forEach(number => {
      const group = make('div', 'proof');
      group.append(make('div', '', '第 ' + number + ' 行'), make('blockquote', '', data.evidence[number]));
      target.append(group);
    });
    dialog.showModal();
    id('close').focus();
  };
  const addRefs = (target, refs) => {
    const available = [...new Set(refs || [])].filter(number => data.evidence[number]);
    if (!available.length) return;
    const button = make('button', 'ref', '原文' + (available.length > 1 ? ' ' + available.length + ' 处' : ''));
    button.type = 'button';
    button.setAttribute('aria-haspopup','dialog');
    button.addEventListener('click', () => showSource(available));
    target.append(button);
  };
  id('close').addEventListener('click', () => dialog.close());
  dialog.addEventListener('click', event => { if(event.target === dialog && (event.clientX < dialog.getBoundingClientRect().left || event.clientX > dialog.getBoundingClientRect().right || event.clientY < dialog.getBoundingClientRect().top || event.clientY > dialog.getBoundingClientRect().bottom)) dialog.close(); });
  data.fields.forEach(field => {
    const row = make('div','fact'), value = make('dd','',field.text);
    addRefs(value,field.refs);
    row.append(make('dt','',field.label),value);
    id('facts').append(row);
  });
  data.traits.forEach(trait => {
    const article = make('article','trait'), description = make('p','',trait.text);
    addRefs(description,trait.refs);
    article.append(make('h3','',trait.title),description);
    id('traits').append(article);
  });
  const tabs = [id('tab-card'),id('tab-rel')], panels = [id('card'),id('relations')];
  const activate = index => {
    tabs.forEach((tab,i) => {
      tab.setAttribute('aria-selected',String(i === index));
      tab.tabIndex = i === index ? 0 : -1;
      panels[i].hidden = i !== index;
    });
  };
  tabs.forEach((tab,index) => {
    tab.addEventListener('click',() => activate(index));
    tab.addEventListener('keydown',event => {
      const next = event.key === 'Home' ? 0 : event.key === 'End' ? 1 : ['ArrowLeft','ArrowRight'].includes(event.key) ? 1-index : -1;
      if(next < 0) return;
      event.preventDefault(); activate(next); tabs[next].focus();
    });
  });
  data.relations.forEach((relation,i) => {
    const article = make('article','rel');
    article.id = 'person-' + i;
    const head = make('div','relhead');
    const title = make('h3','','对' + relation.name);
    title.setAttribute('tabindex','-1');
    head.append(title,make('span','kin',relation.kind));
    const basis = make('p','basis',relation.basis);
    addRefs(basis,relation.refs);
    article.append(head,make('p','reltext',relation.attitude),basis);
    (relation.scenes || []).forEach((scene,index) => {
      const details = make('details','scene');
      details.open = index === 0;
      const summary = make('summary');
      summary.append(make('span','','原文场景'),document.createTextNode(scene.title));
      const excerpt = make('div','excerpt');
      scene.excerpt.forEach(part => {
        const para = make('p');
        para.append(make('span','locator', (part.speaker ? part.speaker + ' · ' : '') + '第 ' + part.line + ' 行'),document.createTextNode(part.text));
        excerpt.append(para);
      });
      details.append(summary,excerpt);
      article.append(details);
    });
    id('relbody').append(article);
    const quick = make('button','quick');
    quick.type = 'button';
    quick.append(make('strong','',relation.name),make('small','',relation.kind));
    quick.addEventListener('click',() => {activate(1); title.focus({preventScroll:true}); article.scrollIntoView({block:'start'});});
    id('quicklinks').append(quick);
  });
  if(location.hash === '#relations') activate(1);
})();
</script>
</body>
</html>
