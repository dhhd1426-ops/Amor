name: Publish check APK 554

on:
  push:
    branches: [release/check-apk-554]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Verify and publish the existing APK
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/artifacts/14733631281/zip" > artifact.zip
          echo "67b7fdb0a69871ef8d6a63093a96f9f584980e935647aae1300805f19bc5162c  artifact.zip" | sha256sum -c
          unzip -p artifact.zip fuguang-lueying-554.apk > fuguang-lueying-554.apk
          test -s fuguang-lueying-554.apk
          unzip -tq fuguang-lueying-554.apk
          gh release create app-build-554 fuguang-lueying-554.apk \
            --target 896d82cd51d0a2caccba740d28c7932b11b2ec90 --prerelease \
            --title "浮光掠影 App 第 554 版" \
            --notes "官方引擎：先 initScene 再 resizeScene。构建记录：https://github.com/dhhd1426-ops/Amor/actions/runs/44970060781"
